; FITALIS — Smart Medicine Reminder
; PlatformIO project config.
;
; You do NOT need this file to use the Arduino IDE — see README.md.
; It exists so the firmware can be compiled and verified on a CI runner.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Keep the build quiet and warning-clean.
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0
